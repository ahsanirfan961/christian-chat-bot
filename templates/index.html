<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Christianity-focused AI assistant providing scripture-grounded theological answers, exact Bible verse lookups, and Christian-themed image generation.">
    <title>Christianity AI Assistant — Scripture-Grounded Answers</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ─── Header ─── -->
<nav class="navbar navbar-dark border-bottom border-gold">
    <div class="container-fluid px-3 px-md-4">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-link text-gold d-md-none p-0 me-2" id="sidebarToggle">
                <i class="bi bi-list fs-4"></i>
            </button>
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <span class="brand-icon">✝</span>
                <span class="brand-text">Christianity AI</span>
            </a>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="badge bg-denomination" id="denominationBadge">General</span>
            <button class="btn btn-outline-gold btn-sm" id="resetBtn" title="New conversation">
                <i class="bi bi-arrow-counterclockwise"></i> New Chat
            </button>
        </div>
    </div>
</nav>

<!-- ─── App Layout ─── -->
<div class="main-wrapper d-flex w-100 flex-grow-1 overflow-hidden position-relative">
    
    <!-- ─── Sidebar ─── -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h5>Past Chats</h5>
        </div>
        <div class="sidebar-content" id="sessionList">
            <!-- populated by JS -->
        </div>
    </div>

    <!-- ─── Main Chat Area ─── -->
    <main class="container-fluid px-0 main-chat">
    <div class="chat-container" id="chatContainer">
        <!-- Welcome Message -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon">✝</div>
            <h1 class="welcome-title">Christianity AI Assistant</h1>
            <p class="welcome-subtitle">
                Ask theological questions, look up Bible verses, or request Christian-themed images.<br>
                Every scripture quote is verified against the source text for accuracy.
            </p>
            <div class="suggestion-grid">
                <button class="suggestion-btn" onclick="sendSuggestion('What does John 3:16 say?')">
                    <i class="bi bi-book"></i>
                    <span>What does John 3:16 say?</span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion('What does the Bible say about forgiveness?')">
                    <i class="bi bi-heart"></i>
                    <span>What about forgiveness?</span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion('I am feeling lost and need guidance')">
                    <i class="bi bi-compass"></i>
                    <span>I feel lost — guide me</span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion('Generate an image of the nativity scene in stained glass style')">
                    <i class="bi bi-palette"></i>
                    <span>Generate a nativity image</span>
                </button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="messages-area" id="messagesArea"></div>
    </div>

    <!-- ─── Input Area ─── -->
    <div class="input-container">
        <div class="container">
            <form id="chatForm" class="input-form">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        name="message"
                        placeholder="Ask a theological question, look up a verse, or request an image…"
                        rows="1"
                        maxlength="2000"
                        required
                    ></textarea>
                    <button type="submit" class="send-btn" id="sendBtn" disabled>
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
                <p class="input-disclaimer">
                    <i class="bi bi-shield-check"></i>
                    All scripture quotes are verified against API.Bible for accuracy.
                </p>
            </form>
        </div>
    </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ─── DOM References ──────────────────────────────────────────────
const chatForm      = document.getElementById('chatForm');
const messageInput  = document.getElementById('messageInput');
const sendBtn       = document.getElementById('sendBtn');
const messagesArea  = document.getElementById('messagesArea');
const welcomeScreen = document.getElementById('welcomeScreen');
const resetBtn      = document.getElementById('resetBtn');
const denomBadge    = document.getElementById('denominationBadge');

// ─── Auto-resize textarea ───────────────────────────────────────
messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
    sendBtn.disabled = !messageInput.value.trim();
});

// Enter to send (Shift+Enter for newline)
messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (messageInput.value.trim()) chatForm.requestSubmit();
    }
});

// ─── Send suggestion ────────────────────────────────────────────
function sendSuggestion(text) {
    messageInput.value = text;
    sendBtn.disabled = false;
    chatForm.requestSubmit();
}

const bibleBooks = {
    "Genesis": "GEN", "Exodus": "EXO", "Leviticus": "LEV", "Numbers": "NUM", "Deuteronomy": "DEU",
    "Joshua": "JOS", "Judges": "JDG", "Ruth": "RUT", "1 Samuel": "1SA", "2 Samuel": "2SA",
    "1 Kings": "1KI", "2 Kings": "2KI", "1 Chronicles": "1CH", "2 Chronicles": "2CH", "Ezra": "EZR",
    "Nehemiah": "NEH", "Esther": "EST", "Job": "JOB", "Psalm": "PSA", "Psalms": "PSA", "Proverbs": "PRO",
    "Ecclesiastes": "ECC", "Song of Solomon": "SNG", "Isaiah": "ISA", "Jeremiah": "JER",
    "Lamentations": "LAM", "Ezekiel": "EZK", "Daniel": "DAN", "Hosea": "HOS", "Joel": "JOL",
    "Amos": "AMO", "Obadiah": "OBA", "Jonah": "JON", "Micah": "MIC", "Nahum": "NAM",
    "Habakkuk": "HAB", "Zephaniah": "ZEP", "Haggai": "HAG", "Zechariah": "ZEC", "Malachi": "MAL",
    "Matthew": "MAT", "Mark": "MRK", "Luke": "LUK", "John": "JHN", "Acts": "ACT",
    "Romans": "ROM", "1 Corinthians": "1CO", "2 Corinthians": "2CO", "Galatians": "GAL",
    "Ephesians": "EPH", "Philippians": "PHP", "Colossians": "COL", "1 Thessalonians": "1TH",
    "2 Thessalonians": "2TH", "1 Timothy": "1TI", "2 Timothy": "2TI", "Titus": "TIT",
    "Philemon": "PHM", "Hebrews": "HEB", "James": "JAS", "1 Peter": "1PE", "2 Peter": "2PE",
    "1 John": "1JN", "2 John": "2JN", "3 John": "3JN", "Jude": "JUD", "Revelation": "REV"
};

const bibleVersions = {
    "KJV": { id: 1, abbr: "KJV" },
    "NIV": { id: 111, abbr: "NIV" },
    "ESV": { id: 59, abbr: "ESV" },
    "NLT": { id: 116, abbr: "NLT" },
    "NKJV": { id: 114, abbr: "NKJV" },
    "AMP": { id: 1588, abbr: "AMP" },
    "CSB": { id: 1713, abbr: "CSB" },
    "NASB": { id: 100, abbr: "NASB1995" },
    "MSG": { id: 97, abbr: "MSG" }
};

function linkifyBibleVerses(text) {
    const bookNames = Object.keys(bibleBooks).join('|');
    const versionNames = Object.keys(bibleVersions).join('|');
    const regex = new RegExp(`\\b(${bookNames})\\s+(\\d+):(\\d+)(?:-\\d+)?(?:\\s*\\(?(${versionNames})\\)?)?\\b`, 'gi');
    
    return text.replace(regex, (match, book, chapter, verse, versionMatch) => {
        const normalizedBook = Object.keys(bibleBooks).find(b => b.toLowerCase() === book.toLowerCase());
        if (!normalizedBook) return match;
        
        const abbr = bibleBooks[normalizedBook];
        
        let versionId = 111;
        let versionAbbr = 'NIV';
        
        if (versionMatch) {
            const v = bibleVersions[versionMatch.toUpperCase()];
            if (v) {
                versionId = v.id;
                versionAbbr = v.abbr;
            }
        }
        
        const url = `https://www.bible.com/bible/${versionId}/${abbr}.${chapter}.${verse}.${versionAbbr}`;
        return `<a href="${url}" target="_blank" class="verse-link" title="Read on Bible.com">${match}</a>`;
    });
}

// ─── Format markdown-ish text ───────────────────────────────────
function formatResponse(text) {
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    
    // Linkify bible verses
    text = linkifyBibleVerses(text);

    // Headers
    text = text.replace(/^### (.+)$/gm, '<h5 class="response-heading">$1</h5>');
    text = text.replace(/^## (.+)$/gm, '<h4 class="response-heading">$1</h4>');
    // Line breaks
    text = text.replace(/\n\n/g, '</p><p>');
    text = text.replace(/\n/g, '<br>');
    // Wrap in paragraph
    text = '<p>' + text + '</p>';
    return text;
}

// ─── Append message bubble ──────────────────────────────────────
function appendMessage(role, content, imageUrl) {
    welcomeScreen.style.display = 'none';
    messagesArea.style.display = 'flex';

    const bubble = document.createElement('div');
    bubble.className = `message message-${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar';
    avatar.innerHTML = role === 'user'
        ? '<i class="bi bi-person-fill"></i>'
        : '<span class="ai-avatar">✝</span>';

    const body = document.createElement('div');
    body.className = 'message-body';

    const label = document.createElement('div');
    label.className = 'message-label';
    label.textContent = role === 'user' ? 'You' : 'Christianity AI';

    const text = document.createElement('div');
    text.className = 'message-text';
    text.innerHTML = role === 'user' ? `<p>${escapeHtml(content)}</p>` : formatResponse(content);

    body.appendChild(label);
    body.appendChild(text);

    // Image attachment
    if (imageUrl) {
        const imgContainer = document.createElement('div');
        imgContainer.className = 'message-image';
        
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = 'Generated Christian-themed image';
        img.loading = 'lazy';
        img.onclick = () => openImageOverlay(imageUrl);
        
        const downloadBtn = document.createElement('button');
        downloadBtn.className = 'download-btn';
        downloadBtn.innerHTML = '<i class="bi bi-download"></i>';
        downloadBtn.title = 'Download Image';
        downloadBtn.onclick = (e) => {
            e.stopPropagation(); // prevent zooming when clicking download
            downloadImage(imageUrl);
        };
        
        imgContainer.appendChild(img);
        imgContainer.appendChild(downloadBtn);
        body.appendChild(imgContainer);
    }

    bubble.appendChild(avatar);
    bubble.appendChild(body);
    messagesArea.appendChild(bubble);

    // Animate in
    requestAnimationFrame(() => bubble.classList.add('visible'));

    // Scroll to bottom
    const chatContainer = document.getElementById('chatContainer');
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return bubble;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ─── Loading indicator ──────────────────────────────────────────
function showLoading() {
    const bubble = appendMessage('ai', '');
    bubble.querySelector('.message-text').innerHTML = `
        <div class="loading-dots">
            <span></span><span></span><span></span>
        </div>
    `;
    bubble.id = 'loadingBubble';
    return bubble;
}

function removeLoading() {
    const el = document.getElementById('loadingBubble');
    if (el) el.remove();
}

// ─── Form submit handler ────────────────────────────────────────
chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = messageInput.value.trim();
    if (!msg) return;

    // Show user message
    appendMessage('user', msg);
    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendBtn.disabled = true;

    // Show loading
    const loadingEl = showLoading();

    try {
        const formData = new FormData();
        formData.append('message', msg);

        const resp = await fetch('/chat', {
            method: 'POST',
            body: formData,
        });

        removeLoading();

        if (!resp.ok) {
            const err = await resp.json();
            appendMessage('ai', `⚠️ Error: ${err.error || 'Something went wrong. Please try again.'}`);
            return;
        }

        const data = await resp.json();
        appendMessage('ai', data.response, data.image_url || null);

        // Update denomination badge
        if (data.denomination && data.denomination !== 'general') {
            denomBadge.textContent = data.denomination.charAt(0).toUpperCase() + data.denomination.slice(1);
            denomBadge.classList.add('active');
        }

    } catch (err) {
        removeLoading();
        appendMessage('ai', '⚠️ Network error. Please check your connection and try again.');
        console.error('Chat error:', err);
    }
});

// ─── Reset session ──────────────────────────────────────────────
resetBtn.addEventListener('click', async () => {
    try {
        await fetch('/reset', { method: 'POST' });
    } catch (e) { /* ignore */ }

    window.location.reload();
});

// ─── Sidebar Toggle ─────────────────────────────────────────────
const sidebarToggle = document.getElementById('sidebarToggle');
const sidebar = document.getElementById('sidebar');
if (sidebarToggle && sidebar) {
    sidebarToggle.addEventListener('click', () => {
        sidebar.classList.toggle('show');
    });
}

// ─── Load History and Sessions ───────────────────────────────────
async function loadSessions() {
    try {
        const resp = await fetch('/sessions');
        if (resp.ok) {
            const data = await resp.json();
            const sessionList = document.getElementById('sessionList');
            sessionList.innerHTML = '';
            
            // Get current session from cookie
            const currentSession = document.cookie.split('; ').find(row => row.startsWith('session_id='))?.split('=')[1];

            data.sessions.forEach(s => {
                const a = document.createElement('a');
                a.className = `session-item ${s.id === currentSession ? 'active' : ''}`;
                a.textContent = s.title;
                a.onclick = async (e) => {
                    e.preventDefault();
                    await fetch(`/session/${s.id}`, { method: 'POST' });
                    window.location.reload();
                };
                sessionList.appendChild(a);
            });
        }
    } catch (err) {
        console.error('Failed to load sessions', err);
    }
}

async function loadChatHistory() {
    try {
        const resp = await fetch('/chat/history');
        if (resp.ok) {
            const data = await resp.json();
            if (data.messages && data.messages.length > 0) {
                welcomeScreen.style.display = 'none';
                messagesArea.style.display = 'flex';
                data.messages.forEach(m => {
                    // Do not scroll down while loading history initially? Wait, appendMessage already scrolls.
                    // That's fine, it will scroll to bottom after all messages are loaded.
                    appendMessage(m.role, m.content, m.image_url);
                });
                if (data.denomination && data.denomination !== 'general') {
                    denomBadge.textContent = data.denomination.charAt(0).toUpperCase() + data.denomination.slice(1);
                    denomBadge.classList.add('active');
                }
            }
        }
    } catch (err) {
        console.error('Failed to load history', err);
    }
}

// ─── Image Overlay & Download ────────────────────────────────────
function openImageOverlay(src) {
    const overlay = document.getElementById('imageOverlay');
    const overlayImg = document.getElementById('overlayImage');
    if (overlay && overlayImg) {
        overlayImg.src = src;
        overlay.classList.add('show');
    }
}

function closeImageOverlay() {
    const overlay = document.getElementById('imageOverlay');
    if (overlay) {
        overlay.classList.remove('show');
        setTimeout(() => {
            document.getElementById('overlayImage').src = '';
        }, 300);
    }
}

function downloadImage(url) {
    const a = document.createElement('a');
    a.href = url;
    a.download = 'christianity-ai-image.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// Run on load
document.addEventListener('DOMContentLoaded', () => {
    loadSessions();
    loadChatHistory();
});
</script>
<!-- ─── Image Overlay ─── -->
<div id="imageOverlay" class="image-overlay" onclick="closeImageOverlay()">
    <img id="overlayImage" src="" alt="Zoomed Image" onclick="event.stopPropagation()">
    
    <button class="download-btn" style="position: absolute; top: 1.5rem; right: 1.5rem; width: 48px; height: 48px; font-size: 1.25rem; z-index: 10001;" onclick="event.stopPropagation(); downloadImage(document.getElementById('overlayImage').src);" title="Download Image">
        <i class="bi bi-download"></i>
    </button>
</div>

</body>
</html>
