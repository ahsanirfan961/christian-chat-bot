<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Christianity-focused AI assistant providing scripture-grounded theological answers, exact Bible verse lookups, and Christian-themed image generation.">
    <title>Christianity AI Assistant — Scripture-Grounded Answers</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ─── Header ─── -->
<nav class="navbar navbar-dark border-bottom border-gold">
    <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <span class="brand-icon">✝</span>
            <span class="brand-text">Christianity AI</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="badge bg-denomination" id="denominationBadge">General</span>
            <button class="btn btn-outline-gold btn-sm" id="resetBtn" title="New conversation">
                <i class="bi bi-arrow-counterclockwise"></i> New Chat
            </button>
        </div>
    </div>
</nav>

<!-- ─── Main Chat Area ─── -->
<main class="container-fluid px-0">
    <div class="chat-container" id="chatContainer">
        <!-- Welcome Message -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon">✝</div>
            <h1 class="welcome-title">Christianity AI Assistant</h1>
            <p class="welcome-subtitle">
                Ask theological questions, look up Bible verses, or request Christian-themed images.<br>
                Every scripture quote is verified against the source text for accuracy.
            </p>
            <div class="suggestion-grid">
                <button class="suggestion-btn" onclick="sendSuggestion('What does John 3:16 say?')">
                    <i class="bi bi-book"></i>
                    <span>What does John 3:16 say?</span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion('What does the Bible say about forgiveness?')">
                    <i class="bi bi-heart"></i>
                    <span>What about forgiveness?</span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion('I am feeling lost and need guidance')">
                    <i class="bi bi-compass"></i>
                    <span>I feel lost — guide me</span>
                </button>
                <button class="suggestion-btn" onclick="sendSuggestion('Generate an image of the nativity scene in stained glass style')">
                    <i class="bi bi-palette"></i>
                    <span>Generate a nativity image</span>
                </button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="messages-area" id="messagesArea"></div>
    </div>

    <!-- ─── Input Area ─── -->
    <div class="input-container">
        <div class="container">
            <form id="chatForm" class="input-form">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        name="message"
                        placeholder="Ask a theological question, look up a verse, or request an image…"
                        rows="1"
                        maxlength="2000"
                        required
                    ></textarea>
                    <button type="submit" class="send-btn" id="sendBtn" disabled>
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
                <p class="input-disclaimer">
                    <i class="bi bi-shield-check"></i>
                    All scripture quotes are verified against API.Bible for accuracy.
                </p>
            </form>
        </div>
    </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ─── DOM References ──────────────────────────────────────────────
const chatForm      = document.getElementById('chatForm');
const messageInput  = document.getElementById('messageInput');
const sendBtn       = document.getElementById('sendBtn');
const messagesArea  = document.getElementById('messagesArea');
const welcomeScreen = document.getElementById('welcomeScreen');
const resetBtn      = document.getElementById('resetBtn');
const denomBadge    = document.getElementById('denominationBadge');

// ─── Auto-resize textarea ───────────────────────────────────────
messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
    sendBtn.disabled = !messageInput.value.trim();
});

// Enter to send (Shift+Enter for newline)
messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (messageInput.value.trim()) chatForm.requestSubmit();
    }
});

// ─── Send suggestion ────────────────────────────────────────────
function sendSuggestion(text) {
    messageInput.value = text;
    sendBtn.disabled = false;
    chatForm.requestSubmit();
}

// ─── Format markdown-ish text ───────────────────────────────────
function formatResponse(text) {
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Headers
    text = text.replace(/^### (.+)$/gm, '<h5 class="response-heading">$1</h5>');
    text = text.replace(/^## (.+)$/gm, '<h4 class="response-heading">$1</h4>');
    // Line breaks
    text = text.replace(/\n\n/g, '</p><p>');
    text = text.replace(/\n/g, '<br>');
    // Wrap in paragraph
    text = '<p>' + text + '</p>';
    return text;
}

// ─── Append message bubble ──────────────────────────────────────
function appendMessage(role, content, imageUrl) {
    welcomeScreen.style.display = 'none';
    messagesArea.style.display = 'flex';

    const bubble = document.createElement('div');
    bubble.className = `message message-${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar';
    avatar.innerHTML = role === 'user'
        ? '<i class="bi bi-person-fill"></i>'
        : '<span class="ai-avatar">✝</span>';

    const body = document.createElement('div');
    body.className = 'message-body';

    const label = document.createElement('div');
    label.className = 'message-label';
    label.textContent = role === 'user' ? 'You' : 'Christianity AI';

    const text = document.createElement('div');
    text.className = 'message-text';
    text.innerHTML = role === 'user' ? `<p>${escapeHtml(content)}</p>` : formatResponse(content);

    body.appendChild(label);
    body.appendChild(text);

    // Image attachment
    if (imageUrl) {
        const imgContainer = document.createElement('div');
        imgContainer.className = 'message-image';
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = 'Generated Christian-themed image';
        img.loading = 'lazy';
        imgContainer.appendChild(img);
        body.appendChild(imgContainer);
    }

    bubble.appendChild(avatar);
    bubble.appendChild(body);
    messagesArea.appendChild(bubble);

    // Animate in
    requestAnimationFrame(() => bubble.classList.add('visible'));

    // Scroll to bottom
    messagesArea.scrollTop = messagesArea.scrollHeight;
    return bubble;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ─── Loading indicator ──────────────────────────────────────────
function showLoading() {
    const bubble = appendMessage('ai', '');
    bubble.querySelector('.message-text').innerHTML = `
        <div class="loading-dots">
            <span></span><span></span><span></span>
        </div>
    `;
    bubble.id = 'loadingBubble';
    return bubble;
}

function removeLoading() {
    const el = document.getElementById('loadingBubble');
    if (el) el.remove();
}

// ─── Form submit handler ────────────────────────────────────────
chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = messageInput.value.trim();
    if (!msg) return;

    // Show user message
    appendMessage('user', msg);
    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendBtn.disabled = true;

    // Show loading
    const loadingEl = showLoading();

    try {
        const formData = new FormData();
        formData.append('message', msg);

        const resp = await fetch('/chat', {
            method: 'POST',
            body: formData,
        });

        removeLoading();

        if (!resp.ok) {
            const err = await resp.json();
            appendMessage('ai', `⚠️ Error: ${err.error || 'Something went wrong. Please try again.'}`);
            return;
        }

        const data = await resp.json();
        appendMessage('ai', data.response, data.image_url || null);

        // Update denomination badge
        if (data.denomination && data.denomination !== 'general') {
            denomBadge.textContent = data.denomination.charAt(0).toUpperCase() + data.denomination.slice(1);
            denomBadge.classList.add('active');
        }

    } catch (err) {
        removeLoading();
        appendMessage('ai', '⚠️ Network error. Please check your connection and try again.');
        console.error('Chat error:', err);
    }
});

// ─── Reset session ──────────────────────────────────────────────
resetBtn.addEventListener('click', async () => {
    try {
        await fetch('/reset', { method: 'POST' });
    } catch (e) { /* ignore */ }

    messagesArea.innerHTML = '';
    messagesArea.style.display = 'none';
    welcomeScreen.style.display = 'flex';
    denomBadge.textContent = 'General';
    denomBadge.classList.remove('active');
});
</script>

</body>
</html>
